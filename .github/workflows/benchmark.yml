# Full benchmark (every planner, ablations, fault recovery) on a schedule and on demand.
# The fast slice runs on every push as part of ci.yml ("Benchmark regression gate").
name: Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run the full suite
        working-directory: backend
        run: python -m benchmark.run --subset full
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmarks/latest.md
            benchmarks/latest.json
            benchmarks/history.jsonl

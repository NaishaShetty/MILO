# Continuous Integration
#
# Runs on every push and pull request. Keeps the backend's static
# quality gates (formatting, linting, typing), its unit test suite
# (including the Phase 3.7 API tests, `backend/tests/test_api_*.py`),
# and the frontend's type-check/test/production-build green without
# requiring a human to run them locally first. Neither job makes a
# real LLM API call -- the backend's `LanguageAgent` is always mocked
# (see `backend/tests/test_api_language.py`'s docstring) and the
# frontend's API client is always mocked (see
# `frontend/src/App.test.tsx`'s docstring).
#
# Phase 8.4 adds a third job, `docker`, that builds both production
# images (docker/Dockerfile, frontend/Dockerfile) with no registry
# push -- a broken Dockerfile/nginx template fails CI the same way a
# broken test does, rather than only being discovered at deploy time.
# It depends on `backend`/`frontend` passing first so a slow Docker
# build never masks a quick, cheap test failure.
#
# Scope note: this project's `test_*.py` files split into two kinds --
# genuine unit tests (backend/tests/) and hands-on integration scripts
# that launch AI2-THOR/Unity or load multi-GB vision model weights
# (backend/**/test_*.py elsewhere, e.g. scene/test_scene.py,
# vision/segmenters/test_sam2.py). Only the former can run on a
# standard GitHub-hosted runner; the latter are outside CI's scope
# until a GPU/simulator-capable runner exists (see .github/README.md).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend -- format, lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Supported interpreter for this project -- matches the cp39
      # PyTorch wheel used in backend/scripts/download_torch.py and the
      # version documented in the README's setup instructions.
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check formatting (black)
        run: black --check backend

      - name: Lint (ruff)
        run: ruff check backend

      - name: Type-check (mypy)
        run: mypy backend

      # Run from backend/ so imports resolve the same way they do for a
      # local developer (see backend/tests/test_task.py's docstring).
      # Scoped to tests/ -- see the module-level comment above. Already
      # includes the Phase 3.7 API tests (test_api_language.py,
      # test_api_health.py), no separate step needed.
      - name: Run test suite (pytest)
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend -- lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc --noEmit

      # Vitest + Testing Library against a fully mocked API client
      # (src/App.test.tsx, src/api/language.test.ts) -- no real backend
      # or network access involved.
      - name: Run test suite (vitest)
        run: npm test

      # `npm run build` re-runs the type-check and then a real Vite
      # production build (`tsc --noEmit && vite build`, package.json)
      # -- catches build-only failures (e.g. an asset path that only
      # breaks under Vite's production output) the dev server and
      # `tsc --noEmit` alone wouldn't. Also confirms the canonical MILO
      # assets (frontend/public/assets/milo/) land in dist/ where
      # frontend/Dockerfile expects them.
      - name: Production build
        run: npm run build

      - name: Verify MILO character assets are in the production build
        run: |
          for f in idle listening thinking speaking executing success error; do
            test -f "dist/assets/milo/milo-$f.png" || { echo "missing milo-$f.png in dist/"; exit 1; }
          done

  e2e:
    name: Frontend -- browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # `--with-deps` installs Chromium plus every OS-level library it
      # needs (libnspr4, libnss3, libasound2, libgbm1, the X11 libs,
      # ...) on the runner -- the exact set that previously had to be
      # installed manually/interactively, now reproducible in one
      # command for both CI and a fresh developer machine. Chromium
      # only: this project's E2E suite has no need for Firefox/WebKit.
      - name: Install Chromium + OS dependencies
        run: npx playwright install --with-deps chromium

      # tests/e2e/ mocks the entire backend HTTP surface via
      # page.route() (see tests/e2e/utils/mockApi.ts) -- no FastAPI
      # process, no real Gemini/OpenAI/ElevenLabs credentials, and no
      # network access are required or used here. Real-provider
      # validation stays a separate, manual/opt-in activity (see
      # docs/troubleshooting.md) -- CI never depends on it or pays for
      # it.
      - name: Run E2E suite (Playwright + Chromium)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker -- build backend and frontend images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Regression test for a real Phase 8.5 finding: the root
      # .dockerignore's bare `.env` pattern did not actually exclude
      # `backend/.env` from this image's build context, so a
      # developer's real backend/.env (API keys) was being baked into
      # every backend image build. A placeholder (never a real secret)
      # .env is created here specifically so the next step can prove
      # it is NOT present in the built image -- CI's checkout has no
      # backend/.env of its own, so without this the bug would never
      # be exercised here.
      - name: Create a placeholder backend/.env to test .dockerignore
        run: echo "OPENAI_API_KEY=placeholder-not-a-real-secret" > backend/.env

      - name: Build backend image
        run: docker build -f docker/Dockerfile -t vlr-backend:ci .

      - name: Verify backend/.env was not baked into the image
        run: |
          if docker run --rm vlr-backend:ci sh -c "test -f /app/.env"; then
            echo "backend/.env was copied into the image -- .dockerignore regression!"
            exit 1
          fi
          echo ".env correctly excluded from the built image."

      - name: Build frontend image
        run: docker build -t vlr-frontend:ci frontend/

      # No real .env in CI -- confirms the backend starts and answers
      # its liveness probe with zero configuration, exactly the
      # "container starts and answers GET /health without one" claim
      # docker/Dockerfile's own docstring makes.
      - name: Smoke-test backend container (no credentials)
        run: |
          docker run -d --name backend-smoke -p 8000:8000 vlr-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker logs backend-smoke
          exit 1
